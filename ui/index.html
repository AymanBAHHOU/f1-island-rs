<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>F1 Island</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- #zone sizes itself to the island; Rust is told its rectangle (see main.js). -->
    <div id="zone">
      <div id="island">
        <div class="compact">
          <span class="dot"></span>
          <span class="c-label" id="cLabel">F1</span>
          <span class="c-right" id="cRight">Loading…</span>
        </div>
        <div class="expanded">
          <div class="eyebrow">Stage 1 · Rust + Tauri</div>
          <h1 id="title">F1 Island</h1>
          <div class="sub" id="subtitle"></div>
          <div class="hero">
            <div><small>Next up</small><strong id="next"></strong></div>
            <div class="count" id="count">--:--:--</div>
          </div>
          <p class="note">This data comes from a Rust function, and the island opens because Rust noticed the mouse.</p>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
