<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>F1 Island</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="live.css" />
  </head>
  <body>
    <!-- #zone sizes itself to the island; Rust is told its rectangle (see main.js). -->
    <div id="zone">
      <div id="island">
        <div class="compact">
          <span class="dot"></span>
          <span class="c-label" id="cLabel">F1</span>
          <span class="c-right" id="cRight">Loading…</span>
        </div>
        <div class="expanded" id="expanded">
          <div class="eyebrow" id="eyebrow">Formula 1</div>
          <h1 id="title">Loading…</h1>
          <div class="sub" id="subtitle"></div>
          <nav class="pages" id="pages"></nav>

          <section id="page-weekend">
            <div class="hero">
              <div><small id="nextLabel">Next up</small><strong id="next"></strong></div>
              <div class="count" id="count">--:--:--</div>
            </div>
            <ul class="sessions" id="sessions"></ul>
          </section>

          <section id="page-live" hidden></section>
          <section id="page-standings" hidden></section>
          <section id="page-circuit" hidden></section>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
