name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Format, lint and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          # Compiles the Mac-only code too (the notch and window level).
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Reuses compiled dependencies between runs (Tauri takes minutes to build).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        run: cargo fmt --check

      - name: Lint (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --lib
