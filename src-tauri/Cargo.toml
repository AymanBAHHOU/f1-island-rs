[package]
name = "f1-island"
version = "0.1.2"
description = "F1 Island, rewritten in Rust with Tauri"
edition = "2021"
license = "MIT"

[lib]
# The logic that needs no window lives in the library, so it can be tested on its own
# (`cargo test --lib`) without compiling Tauri.
name = "f1_island"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
open = "5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

# The camera notch and window level need AppKit directly (see src/mac.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
